<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDX Towers (6x11 Grid)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 980px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0a0a0a;
      border: 1px solid #222;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .action-btn {
      padding: 5px 10px;
      background: #141414;
      border: 1px solid #333;
      color: #ccc;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .action-btn:hover {
      background: #222;
      color: #fff;
      border-color: #555;
    }
    .action-btn.danger:hover {
      border-color: #dc2626;
      color: #ef4444;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      display: inline-block;
    }
    .dot-red { background: #dc2626; }
    .dot-yellow { background: #eab308; }
    .dot-green { background: #16a34a; }

    /* 6x11 Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    .tile {
      background: #0a0a0a;
      border: 1px solid #262626;
      padding: 10px 8px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      color: #fff;
      font-size: 12px;
      position: relative;
    }
    .tile:hover {
      background: #141414;
    }

    .tile.status-not-complete {
      border-left: 5px solid #dc2626;
    }
    .tile.status-in-progress {
      border-left: 5px solid #eab308;
    }
    .tile.status-complete {
      border-left: 5px solid #16a34a;
    }

    .tile-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #888;
      font-family: monospace;
    }
    .tile-name {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .code-tag {
      font-size: 9px;
      background: #1e3a8a;
      color: #93c5fd;
      padding: 1px 4px;
      border-radius: 2px;
      font-family: monospace;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #0d0d0d;
      border: 1px solid #333;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
    }
    .modal-close {
      background: transparent;
      border: 1px solid #333;
      color: #ccc;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 16px;
    }
    .modal-close:hover { background: #222; color: #fff; }

    .status-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      background: #080808;
    }
    .status-btn {
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #333;
      background: #000;
      color: #777;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .status-btn.active-red {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
    .status-btn.active-yellow {
      background: #eab308;
      color: #000;
      border-color: #eab308;
    }
    .status-btn.active-green {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }
    .modal-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
    }
    textarea {
      width: 100%;
      height: 380px;
      background: #000;
      border: 1px solid #333;
      color: #e5e5e5;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      line-height: 1.45;
      padding: 10px;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: #666;
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid #222;
      background: #080808;
    }
    .btn {
      padding: 6px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #262626; }
    .btn-done {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }
    .btn-done:hover { background: #e5e5e5; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>TDX 66 Towers &bull; 6&times;11 Grid</h1>
        <div class="legend">
          <div class="legend-item"><span class="dot dot-red"></span> Red: Not Done (<span id="countRed">48</span>)</div>
          <div class="legend-item"><span class="dot dot-yellow"></span> Yellow: In Progress (<span id="countYellow">18</span>)</div>
          <div class="legend-item"><span class="dot dot-green"></span> Green: Complete (<span id="countGreen">0</span>)</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" onclick="exportBackup()">Export Backup</button>
        <button class="action-btn" onclick="document.getElementById('importFileInput').click()">Import Backup</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importBackup(event)" />
        <button class="action-btn danger" onclick="resetToInitial()">Reset Defaults</button>
      </div>
    </header>

    <div class="grid" id="towerGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modalOverlay" onclick="closeModalOnBackdrop(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <span id="mId" style="font-family: monospace; font-size: 12px; color: #888;">#0</span>
          <span class="modal-title" id="mName" style="margin-left: 6px;">Tower Name</span>
          <span id="mCategory" style="font-size: 11px; color: #aaa; margin-left: 8px;">(Category)</span>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <div class="status-buttons">
        <button id="btnRed" class="status-btn" onclick="setModalStatus('Not Complete')">Red &bull; Not Done</button>
        <button id="btnYellow" class="status-btn" onclick="setModalStatus('In Progress')">Yellow &bull; Progress</button>
        <button id="btnGreen" class="status-btn" onclick="setModalStatus('Complete')">Green &bull; Complete</button>
      </div>

      <div class="modal-body">
        <div class="modal-meta">
          <span>Cost / Unlock: <strong id="mCost" style="color: #ccc;">-</strong></span>
          <span id="mCount">0 lines</span>
        </div>
        <textarea id="mCode" spellcheck="false" onkeydown="handleTab(event)" oninput="onCodeInput(this.value)" placeholder="-- Paste Lua script here..."></textarea>
      </div>

      <div class="modal-actions">
        <div style="display: flex; gap: 8px;">
          <button class="btn" id="btnCopy" onclick="copyCode()">Copy Code</button>
          <button class="btn" onclick="clearCode()">Clear</button>
        </div>
        <button class="btn btn-done" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

      }
      
      // Auto-sync initial data into stored data for any tower with code added
      INITIAL_DATA.forEach(initT => {
        const existing = towers.find(t => t.id === initT.id);
        if (existing && initT.code && initT.code.trim().length > 0) {
          if (!existing.code || existing.code.length < 50 || existing.status === 'Not Complete') {
            existing.code = initT.code;
            existing.status = initT.status;
          }
        }
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(towers));
      updateCounts();
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(towers));
      updateCounts();
    }

    function updateCounts() {
      const red = towers.filter(t => t.status === 'Not Complete').length;
      const yellow = towers.filter(t => t.status === 'In Progress').length;
      const green = towers.filter(t => t.status === 'Complete').length;

      document.getElementById('countRed').textContent = red;
      document.getElementById('countYellow').textContent = yellow;
      document.getElementById('countGreen').textContent = green;
    }

    function render() {
      const grid = document.getElementById('towerGrid');
      grid.innerHTML = towers.map(t => {
        let statusClass = 'status-not-complete';
        if (t.status === 'In Progress') statusClass = 'status-in-progress';
        else if (t.status === 'Complete') statusClass = 'status-complete';

        const hasCode = t.code && t.code.trim().length > 0;

        return `
          <div class="tile ${statusClass}" onclick="openModal(${t.id})">
            <div class="tile-top">
              <span>#${t.id}</span>
              ${hasCode ? '<span class="code-tag">CODE</span>' : ''}
            </div>
            <div class="tile-name" title="${t.name}">${t.name}</div>
          </div>
        `;
      }).join('');
    }

    function openModal(id) {
      currentId = id;
      const t = towers.find(x => x.id === id);
      if (!t) return;

      document.getElementById('mId').textContent = '#' + t.id;
      document.getElementById('mName').textContent = t.name;
      document.getElementById('mCategory').textContent = '(' + t.category + ')';
      document.getElementById('mCost').textContent = t.cost;

      const ta = document.getElementById('mCode');
      ta.value = t.code || '';
      updateLineCount(ta.value);

      updateModalButtons(t.status);

      document.getElementById('modalOverlay').classList.remove('hidden');
      ta.focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      currentId = null;
      render();
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modalOverlay') closeModal();
    }

    function updateModalButtons(status) {
      const bRed = document.getElementById('btnRed');
      const bYellow = document.getElementById('btnYellow');
      const bGreen = document.getElementById('btnGreen');

      bRed.className = 'status-btn' + (status === 'Not Complete' ? ' active-red' : '');
      bYellow.className = 'status-btn' + (status === 'In Progress' ? ' active-yellow' : '');
      bGreen.className = 'status-btn' + (status === 'Complete' ? ' active-green' : '');
    }

    function setModalStatus(newStatus) {
      if (!currentId) return;
      const t = towers.find(x => x.id === currentId);
      if (t) {
        t.status = newStatus;
        updateModalButtons(newStatus);
        save();
      }
    }

    function onCodeInput(val) {
      if (!currentId) return;
      const t = towers.find(x => x.id === currentId);
      if (t) {
        t.code = val;
        save();
        updateLineCount(val);
      }
    }

    function updateLineCount(str) {
      const lines = str ? str.split('\n').length : 0;
      document.getElementById('mCount').textContent = lines + ' lines • ' + str.length + ' chars';
    }

    function copyCode() {
      const ta = document.getElementById('mCode');
      if (ta.value) {
        navigator.clipboard.writeText(ta.value);
        const b = document.getElementById('btnCopy');
        b.textContent = 'Copied!';
        setTimeout(() => b.textContent = 'Copy Code', 1200);
      }
    }

    function clearCode() {
      if (confirm('Clear code for this tower?')) {
        const ta = document.getElementById('mCode');
        ta.value = '';
        onCodeInput('');
      }
    }

    function handleTab(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = e.target.selectionStart;
        const end = e.target.selectionEnd;
        e.target.value = e.target.value.substring(0, start) + '  ' + e.target.value.substring(end);
        e.target.selectionStart = e.target.selectionEnd = start + 2;
        onCodeInput(e.target.value);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('modalOverlay').classList.contains('hidden')) {
        closeModal();
      }
    });

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(towers, null, 2));
      const downloadAnchor = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "tdx_towers_backup_" + dateStr + ".json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported) || imported.length === 0) {
            alert("Invalid backup file: expected a JSON array of towers.");
            return;
          }
          if (confirm("Load backup containing " + imported.length + " towers? This will update your tracker view.")) {
            towers = imported;
            save();
            render();
            updateCounts();
            alert("Backup imported successfully!");
          }
        } catch (err) {
          alert("Failed to parse JSON backup file: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetToInitial() {
      if (confirm("Reset all 66 towers back to initial defaults? All custom edits in your browser will be replaced.")) {
        localStorage.removeItem(STORAGE_KEY);
        towers = JSON.parse(JSON.stringify(INITIAL_DATA));
        save();
        render();
        updateCounts();
        alert("Reset to initial defaults successfully!");
      }
    }

    init();
  </script>
</body>
</html>
